<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kokpit</title>
<style>
:root{--n:#0A95C9;--o:#FC6E08;--g:#021836;--bg:#f2f6fa;--card:#fff;--line:#dbe4ec;--mut:#58708a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--g);font:15px/1.45 system-ui,Segoe UI,sans-serif}
header{display:flex;justify-content:space-between;align-items:baseline;padding:16px 22px 4px}
header b{font-size:20px}header span{color:var(--mut)}
.u{display:grid;gap:14px;padding:14px 22px 28px;max-width:1240px;margin:0 auto;
  grid-template-columns:minmax(260px,1fr) minmax(320px,1.3fr) minmax(240px,1fr);
  grid-template-areas:"lewo srodek prawo" "lewo dol prawo"}
.lewo{grid-area:lewo;display:flex;flex-direction:column;gap:14px}.srodek{grid-area:srodek}
.dol{grid-area:dol;display:grid;grid-template-columns:1fr 1fr;gap:14px}.prawo{grid-area:prawo;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h2{margin:0 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.dex{text-align:center;padding:22px 18px;background:linear-gradient(180deg,#fff,#eaf5fb)}
.av{width:84px;height:84px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:38px;font-weight:700;
  background:radial-gradient(circle at 30% 30%,var(--n),var(--g));box-shadow:0 0 0 6px #0A95C922}
.bub{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-align:left;margin-top:8px}
.bub small{display:block;color:var(--mut);margin-bottom:2px}
.dec{border-top:1px solid var(--line);padding:10px 0}.dec:first-of-type{border-top:0;padding-top:0}
.dec b{display:block}.dec span{color:var(--mut);font-size:13px}
.btns{display:flex;gap:8px;margin-top:8px}
button{font:inherit;border:0;border-radius:999px;padding:6px 16px;cursor:pointer;background:var(--n);color:#fff}
button.nie{background:#e6edf3;color:var(--g)}
.wyb{margin-top:6px;font-weight:600;color:var(--n)}
ul{list-style:none;margin:0;padding:0}li{padding:5px 0;display:flex;gap:8px}li.gotowe{color:var(--mut);text-decoration:line-through}
.k{font-size:30px;font-weight:700;line-height:1}.k.w{color:var(--o)}.k small{font-size:13px;font-weight:400;color:var(--mut)}
.row{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.bar{height:8px;background:#e3ebf2;border-radius:5px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--n)}
@media(max-width:820px){
  .u{grid-template-columns:1fr;grid-template-areas:"srodek" "lewo" "dol" "prawo";padding:10px 14px 24px}
  .dol{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header><b id="firma"></b><span id="dzien"></span></header>
<main class="u">
  <section class="srodek card dex"><div class="av">D</div><b>Dexter</b>
    <div class="bub"><small>Mowa</small><span id="mowa"></span></div>
    <div class="bub"><small>Na ekranie</small><span id="ekran"></span></div></section>
  <section class="lewo">
    <div class="card"><h2>Decyzje</h2><div id="decyzje"></div></div>
    <div class="card"><h2>Zadania dnia</h2><ul id="zadania"></ul></div>
  </section>
  <section class="dol">
    <div class="card"><h2>Marketing</h2><div id="k-marketing"></div></div>
    <div class="card"><h2>Klienci</h2><div id="k-klienci"></div></div>
  </section>
  <section class="prawo">
    <div class="card"><h2>Załoga agentów</h2><div id="k-zaloga"></div></div>
    <div class="card"><h2>Dziś w planie</h2><div id="k-dzis"></div></div>
  </section>
</main>
<script>window.FIXTURE = {"firma": "Piekarnia Przykładowa", "dzien": "poniedziałek, 12 października", "decyzje": [{"id": "d1", "tytul": "Zatwierdzić post na piątek?", "opis": "Zakwas i poranek, grafika gotowa, sędzia przyjął.", "wybor": null}, {"id": "d2", "tytul": "Zamówić mąkę żytnią?", "opis": "Zapas na cztery dni, dostawca potwierdza na wtorek.", "wybor": null}, {"id": "d3", "tytul": "Wznowić agenta kontroli cen?", "opis": "Źródło cen wróciło po awarii.", "wybor": null}], "zadania": [{"tytul": "Sprawdzić wynik nocnych testów", "gotowe": false}, {"tytul": "Przejrzeć kolejkę postów na tydzień", "gotowe": false}, {"tytul": "Odnowić certyfikat strony", "gotowe": true}], "dexter": {"mowa": "Masz trzy decyzje i dwa zadania na dziś. Najpilniejsza jest mąka.", "ekran": "Dzień zaczyna się spokojnie: załoga pracuje, jeden agent zgłosił błąd (kontrola cen), budżet miesiąca na poziomie 41%. Pilne: zamówienie mąki do wtorku."}, "kafle": {"zaloga": {"agenci": 9, "bledy": 1, "budzet": 41}, "marketing": {"zaplanowane": 6, "wstrzymane": 1, "opublikowane": 3}, "klienci": {"nowe": 2, "do_oddzwonienia": 1, "oferty": 1}}, "dzis": [{"godz": "06:00", "co": "Pierwsza blacha"}, {"godz": "11:00", "co": "Dostawa nabiału"}, {"godz": "15:30", "co": "Odbiór tortu (zamówienie)"}]};</script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, text, cls) { var e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; };
  var stan = window.FIXTURE;
  function rysuj() {
    $('firma').textContent = stan.firma; $('dzien').textContent = stan.dzien;
    $('mowa').textContent = stan.dexter.mowa; $('ekran').textContent = stan.dexter.ekran;
    var dc = $('decyzje'); dc.textContent = '';
    stan.decyzje.forEach(function (d) {
      var w = el('div', undefined, 'dec'); w.appendChild(el('b', d.tytul)); w.appendChild(el('span', d.opis));
      if (d.wybor) w.appendChild(el('div', d.wybor === 'tak' ? 'Zatwierdzone: ruszamy' : 'Odrzucone', 'wyb'));
      else {
        var b = el('div', undefined, 'btns');
        ['tak', 'nie'].forEach(function (v) {
          var x = el('button', v === 'tak' ? 'Tak' : 'Nie', v === 'nie' ? 'nie' : ''); x.setAttribute('data-wybor', v);
          x.onclick = function () {
            d.wybor = v; rysuj();
            try { fetch('/api/decyzja', { method: 'POST', body: JSON.stringify({ id: d.id, wybor: v }) }); } catch (e) {}
          };
          b.appendChild(x);
        });
        w.appendChild(b);
      }
      dc.appendChild(w);
    });
    var zl = $('zadania'); zl.textContent = '';
    stan.zadania.forEach(function (z) { var li = el('li', (z.gotowe ? '✓ ' : '○ ') + z.tytul); if (z.gotowe) li.className = 'gotowe'; zl.appendChild(li); });
    var kafel = function (id, pary, glowny) {
      var c = $(id); c.textContent = '';
      var k = el('div', String(glowny[0]), 'k' + (glowny[2] ? ' w' : '')); k.appendChild(el('small', ' ' + glowny[1])); c.appendChild(k);
      pary.forEach(function (p) { var r = el('div', undefined, 'row'); r.appendChild(el('span', p[0])); r.appendChild(el('b', String(p[1]))); c.appendChild(r); });
    };
    var z = stan.kafle.zaloga;
    kafel('k-zaloga', [['Agentów', z.agenci], ['Błędy', z.bledy]], [z.budzet + '%', 'budżetu miesiąca', z.budzet > 70]);
    $('k-zaloga').insertAdjacentElement('beforeend', (function () { var b = el('div', undefined, 'bar'); var i = el('i'); i.style.width = z.budzet + '%'; b.appendChild(i); return b; })());
    var m = stan.kafle.marketing;
    kafel('k-marketing', [['Opublikowane', m.opublikowane], ['Wstrzymane', m.wstrzymane]], [m.zaplanowane, 'zaplanowane']);
    var k = stan.kafle.klienci;
    kafel('k-klienci', [['Do oddzwonienia', k.do_oddzwonienia], ['Oferty', k.oferty]], [k.nowe, 'nowe zgłoszenia']);
    var dz = $('k-dzis'); dz.textContent = '';
    stan.dzis.forEach(function (x) { var r = el('div', undefined, 'row'); r.appendChild(el('b', x.godz)); r.appendChild(el('span', x.co)); dz.appendChild(r); });
  }
  rysuj();
  // Gdy panel jest serwowany przez serwer, stan pochodzi z API (z sesją). Bez serwera działają dane wbudowane.
  try {
    fetch('/api/stan').then(function (r) { return r.ok ? r.json() : null; }).then(function (s) { if (s) { stan = s; rysuj(); } }).catch(function () {});
  } catch (e) {}
})();
</script>
</body>
</html>
